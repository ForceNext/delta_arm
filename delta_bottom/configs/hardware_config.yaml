serial:
  port: "/dev/ttyACM0"
  baudrate: 256000

motors:
  - addr: 1
    name: "motor_1"
    speed_rpm: 500
    accel: 50
    microstep: 16

  - addr: 2
    name: "motor_2"
    speed_rpm: 500
    accel: 50
    microstep: 16

  - addr: 3
    name: "motor_3"
    speed_rpm: 500
    accel: 50
    microstep: 16

joint:
  gear_ratio:
    - [3.0,3.0,3.0] #三个主动臂传动比

  min_pos:
    - [-30,-30,-30] #三个主动臂最小角度

  max_pos:
    - [60,60,60] #三个主动臂最大角度
  

  