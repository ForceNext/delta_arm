serial:
  port: "/dev/ttyACM0"
  baudrate: 256000

motors:
  - addr: 1
    name: "motor_1"
    speed_rpm: 50
    accel: 5
    microstep: 16

  - addr: 2
    name: "motor_2"
    speed_rpm: 50
    accel: 5
    microstep: 16

  - addr: 3
    name: "motor_3"
    speed_rpm: 50
    accel: 5
    microstep: 16

joint:
  gear_ratio:
    - [3.0,3.0,3.0] #三个主动臂传动比

  dir:
    - [-1,-1,-1] #每个关节的正方向系数（+1/-1），用于匹配机械安装方向

  offset:
    - [149.1664062,35.1007812,129.1765625] #每轴关节零位偏置（度）：关节角 = 方向×计数/(51200/360)/减速比 + offset

  min_pos:
    - [-25,-25,-25] #三个主动臂最小角度

  max_pos:
    - [70,70,70] #三个主动臂最大角度（θ=70° 时几何最深 z≈404mm；末端 z 仍由 ROS 节点的 z 守卫限制在 [138,300]）
  

  