serial:
  port: "/dev/ttyS3"
  baudrate: 921600

bus:
  slave_addrs: [1, 2, 3]

control:
  period_us: 2000
  default_speed_rpm: 500
  default_accel: 50
  pulses_per_rev: 51200

realtime:
  rx_tx_cpu: 3
  ctrl_cpu: 4
  rx_tx_priority: 95
  ctrl_priority: 90
  lock_memory: true

motors:
  - addr: 1
    name: "joint_base"
    speed_rpm: 500
    accel: 50
    limit_min: -512000
    limit_max: 512000

  - addr: 2
    name: "joint_shoulder"
    speed_rpm: 300
    accel: 30
    limit_min: -256000
    limit_max: 256000

  - addr: 3
    name: "joint_elbow"
    speed_rpm: 800
    accel: 80
    limit_min: -128000
    limit_max: 128000